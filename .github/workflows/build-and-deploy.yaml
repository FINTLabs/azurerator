name: Azurerator - Build and publish

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select environment
        required: true
        default: test
        type: choice
        options:
          - test
          - prod

permissions:
  contents: read
  packages: write

jobs:
  build-publish:
    name: Build and publish Azurerator
    uses: ./.github/workflows/.build-publish-docker.yaml
    with:
      image_name: ${{ github.repository }}
      context: .
      environment: ${{ inputs.environment }}
