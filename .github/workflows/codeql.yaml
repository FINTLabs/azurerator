name: CodeQL

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0

      - name: Set up Java 17
        uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.5
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build for analysis
        run: bash ./gradlew --no-daemon clean classes -x test

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.39.5
        with:
          category: '/language:java-kotlin'
