name: Build and publish Docker image

on:
  workflow_call:
    inputs:
      image_name:
        description: Image name
        required: true
        type: string
      context:
        description: Build context
        required: true
        type: string
      environment:
        description: Image environment
        required: true
        type: string
    outputs:
      image_tags:
        description: Docker image tags
        value: ${{ jobs.publish.outputs.image_tags }}
      image_digest:
        description: Published image digest
        value: ${{ jobs.publish.outputs.image_digest }}

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_tags: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ inputs.image_name }}
          tags: |
            type=sha,prefix={{date 'YYYYMMDD'}}${{ inputs.environment == 'test' && '-test' || '' }}-,priority=9002
            type=sha,prefix=sha-,enable=${{ inputs.environment == 'prod' }},priority=100

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ inputs.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image_name }}-${{ inputs.environment }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}-${{ inputs.environment }}

      - name: Summarize published image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Published Docker image'
            printf '\nTags:\n```text\n%s\n```\n' "$IMAGE_TAGS"
            printf '\nDigest: `%s`\n' "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
